<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25D366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#128C7E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F4F2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect x="10" y="10" width="236" height="236" rx="50" ry="50" fill="url(#bgGradient)"/>

  <!-- Shadow effect -->
  <rect x="12" y="12" width="232" height="232" rx="48" ry="48" fill="none" stroke="#000000" stroke-width="2" opacity="0.1"/>

  <!-- Letter T -->
  <text x="128" y="190" font-family="Arial, sans-serif" font-size="180" font-weight="bold"
        text-anchor="middle" fill="url(#letterGradient)" stroke="#0A5F56" stroke-width="3">T</text>

  <!-- Small browser indicator (window icon in top right) -->
  <rect x="175" y="35" width="50" height="40" rx="5" ry="5" fill="#FFFFFF" opacity="0.9"/>
  <rect x="180" y="40" width="40" height="10" rx="2" ry="2" fill="#128C7E"/>
  <line x1="180" y1="55" x2="220" y2="55" stroke="#128C7E" stroke-width="2"/>
  <line x1="180" y1="62" x2="220" y2="62" stroke="#128C7E" stroke-width="2"/>
  <line x1="180" y1="69" x2="210" y2="69" stroke="#128C7E" stroke-width="2"/>
</svg>
